spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:h2:mem:tradeway;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

server:
  port: 8080
  servlet:
    session:
      timeout: 10m

reporting:
  datasource:
    url: ${REPORTING_DB_URL:jdbc:h2:mem:tradeway_reporting;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${REPORTING_DB_USERNAME:sa}
    password: ${REPORTING_DB_PASSWORD:}
    driver-class-name: ${REPORTING_DB_DRIVER:org.h2.Driver}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
